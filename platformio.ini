; Small TV Evolution Pro - firmware per NM-TV-154 (ESP32-WROOM-32E, 4 MB)
[env:nmtv154]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_upload.flash_size = 4MB
board_build.partitions = partitions_nmtv.csv

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    bblanchon/ArduinoJson@^7.0.4

; Configurazione del display ST7789 240x240 (pin dalla guida NMMiner NM-TV-154).
; Non serve modificare User_Setup.h: tutto e' qui.
build_flags =
    -DCORE_DEBUG_LEVEL=0
    ; Diagnostica touch (valori in basso nel menu): togli il ; per attivarla.
    ; -DTOUCH_DEBUG=1
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    -DTFT_MISO=-1
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DSPI_FREQUENCY=20000000
    -DUSE_HSPI_PORT
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    ; Se rosso e blu risultano scambiati, scommenta la riga seguente:
    ; -DTFT_RGB_ORDER=TFT_BGR
