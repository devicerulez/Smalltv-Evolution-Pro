name: Compila firmware

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Installa PlatformIO ed esptool
        run: pip install platformio "esptool<5"

      - name: Compila
        run: pio run -e nmtv154

      - name: Crea le immagini .bin
        run: |
          mkdir -p out
          B=.pio/build/nmtv154
          BOOT_APP0=$(find ~/.platformio/packages -name boot_app0.bin | head -n 1)
          python -m esptool --chip esp32 merge_bin \
            -o out/nmtv-firmware-completo.bin \
            --flash_mode dio --flash_freq 40m --flash_size 4MB \
            0x1000 $B/bootloader.bin \
            0x8000 $B/partitions.bin \
            0xe000 "$BOOT_APP0" \
            0x10000 $B/firmware.bin
          cp $B/firmware.bin out/nmtv-firmware-app.bin
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: nmtv-firmware
          path: out/*.bin

      - name: Pubblica la release (solo con un tag, es. v1.0.0)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.bin
